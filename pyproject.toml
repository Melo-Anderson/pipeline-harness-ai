[project]
name = "harness-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.111.0",
    "sse-starlette>=2.0.0",
    "uvicorn>=0.29.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "croniter>=2.0.0",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "jsonschema>=4.26.0",
    "langchain-google-genai>=4.3.2",
    "psycopg2-binary>=2.9.12",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "pgvector>=0.5.0",
    "mcp>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."

[dependency-groups]
dev = [
    "pytest-httpx>=0.36.2",
    "respx>=0.23.1",
    "types-pyyaml>=6.0.12.20260724",
]
